<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Aguafina+Script&family=Carter+One&family=Geist:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet" />

    <link rel="stylesheet" href="./style.css" />
    <title>Store</title>
  </head>
  <body>
    <div class="container" id="container">
      <!-- header -->
      <header class="header">
        <h2>CRUDS</h2>
        <span>Product Management System</span>
      </header>

      <!-- Inputs -->
      <section class="inputs">
        <input placeholder="title" type="text" id="title" />
        <div class="price_container">
          <input onkeyup="getTotal()" placeholder="price" type="number" id="price" />
          <input onkeyup="getTotal()" placeholder="taxes" type="number" id="taxes" />
          <input onkeyup="getTotal()" placeholder="ads" type="number" id="ads" />
          <input onkeyup="getTotal()" placeholder="discount" type="number" id="discount" />
          <span id="total"></span>
        </div>
        <input placeholder="count" type="text" id="count" />
        <input placeholder="catagory" type="text" id="catagory" />
        <button  id="submit">create</button>
        <input placeholder="search" type="text" id="search" />
        <div class="search-btn">
          <button id="search-by-title">search by title</button>
          <button id="search-by-catagory">search by catagory</button>
        </div>
        <!-- <button id="delete-all">Delete All</button> -->
      </section>

      <!-- Taple -->
      <section class="table">
        <table>
          <!-- Head -->
          <tr>
            <th>id</th>
            <th>title</th>
            <th>price</th>
            <th>taxes</th>
            <th>ads</th>
            <th>discount</th>
            <th>total</th>
            <th>catagory</th>
            <th>update</th>
            <th>delete</th>
          </tr>
          <!-- Body -->

          <tbody>
            <tr>
              <td>1</td>
              <td>oppo</td>
              <td>2000</td>
              <td>120</td>
              <td>200</td>
              <td>50</td>
              <td>3000</td>
              <td>phone</td>
              <td><button id="update">update</button></td>
              <td><button id="delete">delete</button></td>
            </tr>
          </tbody>
        </table>
      </section>
    </div>

    <script src="main.js"></script>
  </body>
</html>
